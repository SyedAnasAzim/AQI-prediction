name: Run Inference
on:
    # schedule:
    #     - cron: '3 * * * *'
    workflow_dispatch:
    workflow_run:
      workflows: ["Update Data"]
      types:
        - completed
permissions:
    contents: write
    
jobs: 
    update: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with: 
                python-version: 3.12

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r scripts/requirements_inference.txt

            - name: Run the Inference script 
              env:
                HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
              run: |
                  python scripts/inference.py

            - name: Commit updated predictions log
              run: |
                git config user.name "github-actions"
                git config user.email "actions@github.com"
                git add predictions_log.csv
                git diff --staged --quiet || git commit -m "Update predictions log"
                git push
