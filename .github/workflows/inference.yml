name: Run Inference

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Data"]
    types:
      - completed
concurrency:
  group: inference
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  inference:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_inference.txt

      - name: Run the Inference script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python scripts/inference.py

      - name: Commit updated predictions log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add predictions_log.csv

          if git diff --staged --quiet; then
            echo "No changes to predictions_log.csv"
            exit 0
          fi

          git commit -m "Update predictions log"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
