name: Run Inference

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Data"]
    types:
      - completed
concurrency:
  group: inference
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  inference:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_inference.txt

      - name: Run the Inference script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python scripts/inference.py

      - name: Commit updated predictions log
        run: |
           git config user.name "aqi-bot"
           git config user.email "aqi-bot@users.noreply.github.com"
           git add predictions_log.csv data/aqi_shap_values.csv
           git diff --cached --quiet || git commit -m "hourly inference: update predictions_log.csv and shap values"
           git pull --rebase
           git push
