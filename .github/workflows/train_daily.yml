name: Daily Model Training
on:
  # schedule:
  #   - cron: "3 0 * * *"   # 03:00 UTC daily — after the hourly feature pipeline has caught up
  workflow_dispatch:     # allows manual triggering from the Actions tab
concurrency:
  group: data-6d-writer
  cancel-in-progress: false
permissions: 
  contents: write
    
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hopsworks["python"] scikit-learn pandas numpy joblib tensorflow python-dotenv
      - name: Run daily training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python scripts/model_training.py
      - name: Commit and push updated data
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git pull --rebase
          git add data/hourly_data_6d.csv data/background_shap_karachi_aqi.csv
          git diff --cached --quiet || git commit -m "daily training: update data_6d.csv and shap background"
          git push
